[workspace]
channels = ["conda-forge", "bioconda", "pypi"]
name = "MolJEPA-Embeddings"
platforms = ["osx-arm64","linux-64", "osx-64"]
version = "0.1.0"

[tasks]
pipeline = "nextflow run main.nf"
qc = "bash workflow/scripts/render_qc.sh"

[dependencies]
python = ">=3.11.5,<3.12"
pytorch = "2.8.0.*"
pytorch_geometric = "2.7.0.*"
molfeat = "0.10.1.*"
numpy = "==1.26.4"
rdkit = "2026.3.4.*"
safetensors = ">=0.8.0,<0.9"
pandas = ">=3.0.6,<4"
tqdm = ">=4.70.1,<5"
pyyaml = ">=6.0.3,<7"
scikit-learn = ">=1.9.1,<2"
matplotlib-base = ">=3.11.2,<4"
seaborn-base = ">=0.13.2,<0.14"
jupyterlab = ">=4.6.6,<5"
nbconvert = ">=7.17.2,<8"
bleach = ">=6.4.0,<7"
tinycss2 = ">=1.4.0,<2"
lxml = ">=6.1.3,<7"
beautifulsoup4 = ">=4.15.0,<5"
nextflow = ">=26.10.7,<27"

[pypi-dependencies]
transformers = "==4.50.3"
damply = ">=0.10.0, <0.11"
umap-learn = ">=0.5.12, <0.6"
